name: Apply bill upload integration fix

on:
  push:
    branches:
      - agent/fix-bill-upload-breakdown
    paths:
      - scripts/agent-apply-bill-upload-fix.py
      - .github/workflows/agent-apply-bill-upload-fix.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-bill-upload-breakdown
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply focused source patch
        run: python scripts/agent-apply-bill-upload-fix.py
      - name: Install dependencies
        run: npm ci
      - name: Validate TypeScript
        run: npm run typecheck
      - name: Validate lint
        run: npm run lint
      - name: Commit generated integration
        run: |
          git config user.name "Costivra GitHub Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/portal-pages.tsx \
            src/components/document-upload-experience.test.ts \
            scripts/agent-apply-bill-upload-fix.py \
            .github/workflows/agent-apply-bill-upload-fix.yml
          git commit -m "Wire modern bill upload experience"
          git push origin HEAD:agent/fix-bill-upload-breakdown
