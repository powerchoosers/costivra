name: Refactor bill upload contract

on:
  push:
    branches:
      - agent/fix-bill-upload-breakdown
    paths:
      - scripts/agent-refactor-upload-contract.py
      - .github/workflows/agent-refactor-upload-contract.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-bill-upload-breakdown
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply upload contract refactor
        run: python scripts/agent-refactor-upload-contract.py
      - name: Install dependencies
        run: npm ci
      - name: Validate TypeScript
        run: npm run typecheck
      - name: Validate lint
        run: npm run lint
      - name: Run focused tests
        run: npm test -- src/lib/documents/client-upload.test.ts 'src/app/api/portal/documents/[id]/breakdown/route.test.ts'
      - name: Commit executable coverage
        run: |
          git config user.name "Costivra GitHub Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/document-upload-experience.tsx \
            src/components/document-upload-experience.test.ts \
            src/lib/documents/client-upload.ts \
            src/lib/documents/client-upload.test.ts \
            'src/app/api/portal/documents/[id]/breakdown/route.test.ts' \
            scripts/agent-refactor-upload-contract.py \
            .github/workflows/agent-refactor-upload-contract.yml
          git commit -m "Add executable bill upload coverage"
          git push origin HEAD:agent/fix-bill-upload-breakdown
